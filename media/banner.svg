<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="3WM Eco-Rewards: turning eco-actions into digital rewards">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f2a"/>
      <stop offset="0.55" stop-color="#0f3a3f"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>

  <!-- leaf / token mark -->
  <g transform="translate(980 70)">
    <circle cx="110" cy="110" r="104" fill="none" stroke="url(#accent)" stroke-width="3" stroke-opacity="0.6"/>
    <circle cx="110" cy="110" r="78" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.15"/>
    <path d="M110 48c36 4 58 30 52 64-4 24-22 40-50 44-30-6-52-30-50-58 2-28 20-44 48-50z" fill="url(#accent)" fill-opacity="0.9"/>
    <path d="M110 150c0-36 10-60 38-80" fill="none" stroke="#0b1f2a" stroke-width="5" stroke-linecap="round"/>
    <text x="110" y="228" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#5eead4">3WM TOKEN</text>
  </g>

  <text x="80" y="108" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="5" fill="#5eead4">PROOF OF CONCEPT · WEB3 · ECO-TECH</text>
  <text x="80" y="188" font-family="'Segoe UI',Arial,sans-serif" font-size="76" font-weight="800" fill="#ffffff">3WM Eco-Rewards</text>
  <rect x="80" y="208" width="170" height="6" rx="3" fill="url(#accent)"/>
  <text x="80" y="262" font-family="'Segoe UI',Arial,sans-serif" font-size="28" fill="#d1fae5">Turning real-world eco-actions into digital rewards.</text>
  <text x="80" y="302" font-family="'Segoe UI',Arial,sans-serif" font-size="22" fill="#9ca3af">No crypto knowledge required.</text>
</svg>
